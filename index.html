<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>الأولمبياد</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700;800;900&family=Tajawal:wght@400;500;700&display=swap" rel="stylesheet">
<style>
  :root{
    --bg-0:#0A0F1C; --bg-1:#0F1729; --panel:#151F38; --panel-2:#1B2745; --line:#2A3A63;
    --gold:#E8B84B; --gold-dim:#8A6E2E; --bronze:#C97B4A; --win:#43D17A;
    --text:#F4F1EA; --muted:#8C97B8;
  }
  *{box-sizing:border-box;}
  body{
    margin:0;min-height:100vh;
    background:
      radial-gradient(circle at 15% -10%, rgba(232,184,75,.10), transparent 45%),
      radial-gradient(circle at 100% 10%, rgba(201,123,74,.10), transparent 40%),
      linear-gradient(180deg,var(--bg-0),var(--bg-1) 60%);
    color:var(--text);font-family:'Tajawal',sans-serif;padding:28px 16px 60px;
  }
  h1,h2,h3,.disp{font-family:'Cairo',sans-serif;}
  .wrap{max-width:1000px;margin:0 auto;}
  .top{display:flex;align-items:center;justify-content:space-between;margin-bottom:28px;gap:10px;}
  .brand{
    font-family:'Cairo',sans-serif;font-weight:900;font-size:26px;letter-spacing:.5px;
    background:linear-gradient(90deg,var(--gold),#FFE9B3 40%,var(--gold));
    -webkit-background-clip:text;background-clip:text;color:transparent;cursor:pointer;user-select:none;
  }
  .top-actions{display:flex;gap:8px;}
  .top-btn{
    border:1px solid var(--line);background:var(--panel);color:var(--muted);
    padding:8px 16px;border-radius:10px;font-family:'Tajawal';font-size:13px;cursor:pointer;transition:.15s;
    white-space:nowrap;
  }
  .top-btn:hover{border-color:var(--gold-dim);color:var(--gold);}
  .top-btn:disabled{opacity:.3;cursor:not-allowed;}

  .hero{text-align:center;margin:10px 0 34px;}
  .hero .eyebrow{color:var(--bronze);font-size:13px;letter-spacing:3px;font-weight:700;font-family:'Cairo';}
  .hero h1{font-size:48px;font-weight:900;margin:8px 0 6px;
    background:linear-gradient(90deg,#FFE9B3,var(--gold) 50%,var(--bronze));
    -webkit-background-clip:text;background-clip:text;color:transparent;}
  .hero p{color:var(--muted);font-size:15px;margin:0;}

  .saved-section{max-width:760px;margin:0 auto 38px;}
  .saved-title{font-family:'Cairo';font-weight:800;font-size:15px;color:var(--gold);margin-bottom:10px;}
  .saved-item{
    display:flex;align-items:center;gap:12px;background:var(--panel);border:1px solid var(--line);
    border-radius:12px;padding:12px 16px;margin-bottom:8px;
  }
  .saved-item .info{flex:1;}
  .saved-item .nm{font-family:'Cairo';font-weight:700;font-size:14.5px;}
  .saved-item .meta{color:var(--muted);font-size:12px;margin-top:2px;}
  .saved-item button{
    border:none;border-radius:9px;padding:8px 14px;font-family:'Cairo';font-weight:700;font-size:12.5px;cursor:pointer;
  }
  .btn-continue{background:var(--gold);color:#241A05;}
  .btn-del{background:transparent;border:1px solid var(--line) !important;color:var(--muted);margin-right:4px;}
  .btn-del:hover{border-color:var(--bronze) !important;color:var(--bronze);}

  .grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(180px,1fr));gap:16px;margin-top:8px;}
  .game-card{
    background:linear-gradient(160deg,var(--panel),var(--panel-2));
    border:1px solid var(--line);border-radius:16px;padding:26px 16px;text-align:center;cursor:pointer;
    transition:.18s ease;position:relative;overflow:hidden;
  }
  .game-card:hover{border-color:var(--gold);transform:translateY(-3px);box-shadow:0 10px 24px rgba(0,0,0,.35);}
  .game-card .ic{font-size:38px;display:block;margin-bottom:12px;filter:drop-shadow(0 0 10px rgba(232,184,75,.25));}
  .game-card .name{font-family:'Cairo';font-weight:700;font-size:17px;}

  .panel{
    background:linear-gradient(160deg,var(--panel),var(--panel-2));
    border:1px solid var(--line);border-radius:18px;padding:28px;max-width:560px;margin:0 auto;
  }
  .panel h2{margin:0 0 4px;font-size:22px;font-weight:800;}
  .panel .sub{color:var(--muted);font-size:13px;margin:0 0 22px;}
  .choice-row{display:flex;gap:14px;flex-wrap:wrap;}
  .choice-btn{
    flex:1;min-width:140px;background:var(--bg-1);border:1.5px solid var(--line);
    border-radius:14px;padding:20px 14px;text-align:center;cursor:pointer;transition:.15s;
    font-family:'Cairo';font-weight:700;font-size:15px;color:var(--text);
  }
  .choice-btn .ic{font-size:26px;display:block;margin-bottom:8px;}
  .choice-btn:hover{border-color:var(--gold);background:#182242;}

  .field-row{display:flex;gap:8px;margin-bottom:10px;align-items:center;}
  .field-row input{
    flex:1;background:var(--bg-1);border:1.5px solid var(--line);color:var(--text);
    padding:11px 14px;border-radius:10px;font-family:'Tajawal';font-size:14px;
  }
  .field-row input:focus{outline:none;border-color:var(--gold);}
  .field-row .num{width:26px;text-align:center;color:var(--gold-dim);font-family:'Cairo';font-weight:700;font-size:13px;}
  .icon-btn{
    width:34px;height:34px;flex:0 0 34px;border-radius:9px;border:1px solid var(--line);
    background:var(--bg-1);color:var(--muted);cursor:pointer;font-size:16px;line-height:1;
    display:flex;align-items:center;justify-content:center;transition:.15s;
  }
  .icon-btn:hover{border-color:var(--bronze);color:var(--bronze);}
  .icon-btn:disabled{opacity:.3;cursor:not-allowed;}

  .add-btn{
    width:100%;padding:11px;border-radius:10px;border:1.5px dashed var(--line);
    background:transparent;color:var(--muted);font-family:'Tajawal';cursor:pointer;margin-top:6px;transition:.15s;
  }
  .add-btn:hover{border-color:var(--gold);color:var(--gold);}

  .num-select{display:flex;align-items:center;gap:10px;margin:16px 0;}
  .num-select label{color:var(--muted);font-size:14px;flex:1;}
  .num-select .stepper{display:flex;align-items:center;gap:10px;}
  .num-select .val{font-family:'Cairo';font-weight:800;font-size:18px;color:var(--gold);width:26px;text-align:center;}

  .primary-btn{
    width:100%;margin-top:18px;padding:15px;border-radius:12px;border:none;
    background:linear-gradient(90deg,var(--gold),#F3D488);color:#241A05;font-family:'Cairo';font-weight:800;
    font-size:16px;cursor:pointer;transition:.15s;box-shadow:0 6px 18px rgba(232,184,75,.18);
  }
  .primary-btn:hover{filter:brightness(1.06);transform:translateY(-1px);}
  .primary-btn:disabled{opacity:.4;cursor:not-allowed;transform:none;}
  .ghost-btn{
    width:100%;margin-top:10px;padding:12px;border-radius:12px;border:1px solid var(--line);
    background:transparent;color:var(--muted);font-family:'Tajawal';cursor:pointer;transition:.15s;
  }
  .ghost-btn:hover{border-color:var(--gold-dim);color:var(--gold);}
  .warn{color:var(--bronze);font-size:12.5px;margin-top:8px;min-height:16px;}

  .team-block{background:var(--bg-1);border:1px solid var(--line);border-radius:12px;padding:14px 16px;margin-bottom:12px;}
  .team-block input{
    width:100%;background:transparent;border:none;border-bottom:1.5px solid var(--line);
    color:var(--gold);font-family:'Cairo';font-weight:700;font-size:15px;padding:4px 2px 8px;margin-bottom:8px;
  }
  .team-block input:focus{outline:none;border-color:var(--gold);}
  .team-block .plist{color:var(--muted);font-size:13px;line-height:1.9;}
  .team-block .plist span{background:var(--panel-2);border-radius:6px;padding:2px 8px;margin-left:6px;display:inline-block;margin-bottom:4px;}

  .bracket-head{display:flex;align-items:center;justify-content:space-between;max-width:1000px;margin:0 auto 18px;flex-wrap:wrap;gap:10px;}
  .bracket-head .title{font-family:'Cairo';font-weight:800;font-size:18px;}
  .save-btn{
    border:1px solid var(--gold-dim);background:rgba(232,184,75,.08);color:var(--gold);
    padding:9px 18px;border-radius:10px;font-family:'Cairo';font-weight:700;font-size:13px;cursor:pointer;transition:.15s;
  }
  .save-btn:hover{background:rgba(232,184,75,.16);}
  .champion{
    text-align:center;background:linear-gradient(90deg,rgba(232,184,75,.12),rgba(201,123,74,.12));
    border:1px solid var(--gold-dim);border-radius:16px;padding:22px;margin-bottom:30px;
  }
  .champion .cap{color:var(--bronze);font-size:12px;letter-spacing:2px;font-family:'Cairo';font-weight:700;}
  .champion .cname{font-family:'Cairo';font-weight:900;font-size:30px;color:var(--gold);margin-top:6px;}
  .bracket-scroll{overflow-x:auto;padding-bottom:14px;}
  .bracket{display:flex;flex-direction:row-reverse;gap:46px;direction:ltr;min-width:max-content;padding:6px;position:relative;}
  .round-col{display:flex;flex-direction:column;justify-content:space-around;gap:18px;min-width:210px;position:relative;z-index:1;}
  .round-title{font-family:'Cairo';font-weight:800;font-size:13px;color:var(--bronze);text-align:center;letter-spacing:1px;margin-bottom:6px;}
  .match{background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:10px;position:relative;z-index:1;}
  .match.playable{border-color:var(--gold-dim);}
  .slot{
    display:flex;align-items:center;justify-content:space-between;padding:8px 10px;border-radius:8px;
    margin-bottom:6px;font-family:'Tajawal';font-size:13.5px;background:var(--bg-1);color:var(--text);
  }
  .slot:last-child{margin-bottom:0;}
  .slot.empty{color:var(--muted);font-style:italic;}
  .slot.winner{background:rgba(67,209,122,.14);border:1px solid var(--win);color:var(--win);font-weight:700;}
  .slot.loser{opacity:.45;text-decoration:line-through;}
  .slot.clickable{cursor:pointer;transition:.12s;}
  .slot.clickable:hover{background:var(--panel-2);border:1px solid var(--gold);}
  .play-hint{font-size:11px;color:var(--gold-dim);text-align:center;margin-top:4px;font-family:'Cairo';}
  .next-info{font-size:11px;color:var(--muted);text-align:center;margin-top:6px;padding-top:6px;border-top:1px dashed var(--line);line-height:1.6;}
  .next-info b{color:var(--gold);}
  .view-note{
    max-width:1000px;margin:0 auto 18px;text-align:center;color:var(--muted);font-size:12.5px;
    background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:9px;
  }
  .landing-admin{max-width:400px;margin:36px auto 0;text-align:center;}
  .admin-btn{
    border:1px solid var(--gold-dim);background:rgba(232,184,75,.06);color:var(--gold);
    padding:12px 22px;border-radius:12px;font-family:'Cairo';font-weight:700;font-size:14px;cursor:pointer;transition:.15s;
  }
  .admin-btn:hover{background:rgba(232,184,75,.14);}
  .empty-note{max-width:600px;margin:0 auto 30px;text-align:center;color:var(--muted);font-size:13px;}
  .reset-wrap{text-align:center;margin-top:34px;}
</style>
</head>
<body>
<div class="wrap">
  <div class="top">
    <div class="brand" onclick="goHome()">🏆 الأولمبياد</div>
    <div class="top-actions">
      <button class="top-btn" id="logoutBtn" onclick="adminLogout()" style="display:none">🚪 خروج المنظم</button>
      <button class="top-btn" id="backBtn" onclick="goBack()" style="display:none">⬅ رجوع خطوة</button>
      <button class="top-btn" id="homeBtn" onclick="goHome()" style="display:none">↩ الرئيسية</button>
    </div>
  </div>
  <div id="app"></div>
</div>

<script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-database-compat.js"></script>
<script>
/* ---------------- shared cloud storage (Firebase) ---------------- */
const firebaseConfig = {
  apiKey: "AIzaSyCYMhOwQIRiaU77SV7hl54Hx5PX2XlJZDc",
  authDomain: "olympiad-ae7e6.firebaseapp.com",
  databaseURL: "https://olympiad-ae7e6-default-rtdb.firebaseio.com",
  projectId: "olympiad-ae7e6",
  storageBucket: "olympiad-ae7e6.firebasestorage.app",
  messagingSenderId: "105124370010",
  appId: "1:105124370010:web:c65cbaa852fe6833e1ea63"
};
let db = null;
try{
  firebase.initializeApp(firebaseConfig);
  db = firebase.database();
}catch(e){ db = null; }

/* ---------------- persistence helpers ---------------- */
function safeGet(key){ try{ const v = localStorage.getItem(key); return v?JSON.parse(v):null; }catch(e){ return null; } }
function safeSet(key,val){ try{ localStorage.setItem(key, JSON.stringify(val)); return true; }catch(e){ return false; } }
function safeSessionGet(key){ try{ const v = sessionStorage.getItem(key); return v?JSON.parse(v):null; }catch(e){ return null; } }
function safeSessionSet(key,val){ try{ sessionStorage.setItem(key, JSON.stringify(val)); return true; }catch(e){ return false; } }

const MASTER_CODE = '2722007';
let adminPassword = safeGet('olympiad_admin_password') || 'Gravity2026';
const ADMIN_SCREENS = ['adminHome','subtype','individualSetup','teamMode','teamNamesSetup','teamDrawPlayers','teamDrawResult','secretPassword'];
let isAdmin = !!safeSessionGet('olympiad_admin');

function attachAdminPasswordListener(){
  if(!db) return;
  db.ref('settings/adminPassword').on('value', snap=>{
    const val = snap.val();
    if(val && typeof val === 'string' && val.trim() !== ''){
      adminPassword = val;
      safeSet('olympiad_admin_password', adminPassword);
      if(state.screen==='secretPassword') render();
    }
  });
}

function adminLogin(){
  const pw = prompt('كلمة سر المنظم:');
  if(pw===null) return;
  const trimmed = pw.trim();
  if(trimmed === MASTER_CODE){
    isAdmin = true;
    safeSessionSet('olympiad_admin', true);
    snapshot();
    state.screen='secretPassword';
    render();
    return;
  }
  if(trimmed === adminPassword){
    isAdmin = true;
    safeSessionSet('olympiad_admin', true);
    snapshot();
    state.screen='adminHome';
    render();
  } else {
    alert('❌ كلمة السر غلط');
  }
}
function adminLogout(){
  isAdmin = false;
  safeSessionSet('olympiad_admin', false);
  goHome();
}

let savedList = safeGet('olympiad_saved_cache') || [];
let historyStack = [];

function attachSavedListener(){
  if(!db) return;
  db.ref('savedGames').on('value', snap=>{
    const val = snap.val() || {};
    savedList = Object.keys(val).map(k=>val[k]).sort((a,b)=>b.savedAt-a.savedAt);
    safeSet('olympiad_saved_cache', savedList);
    if(state.screen==='landing' || state.screen==='adminHome'){ render(); }
    if(state.screen==='bracket' && state.viewOnly && state.savedId){
      const entry = savedList.find(s=>s.id===state.savedId);
      if(entry){
        const fresh = JSON.parse(JSON.stringify(entry.data));
        fresh.viewOnly = true;
        state = fresh;
        render();
      }
    }
  });
}

function defaultState(){
  return {
    screen:'landing', game:null, category:null,
    players:['',''], teams:['',''],
    drawPlayers:['','','',''], numTeams:2, drawResult:null,
    entrants:[], bracket:null, savedId:null, viewOnly:false
  };
}
let state = safeGet('olympiad_autosave') || defaultState();

function persistCurrent(){ safeSet('olympiad_autosave', state); }
function persistSavedListCache(){ safeSet('olympiad_saved_cache', savedList); }

function snapshot(){
  historyStack.push(JSON.parse(JSON.stringify(state)));
  if(historyStack.length>60) historyStack.shift();
}
function goBack(){
  if(historyStack.length===0) return;
  state = historyStack.pop();
  render();
}

function goHome(){
  snapshot();
  state = defaultState();
  state.screen = isAdmin ? 'adminHome' : 'landing';
  render();
}

/* ---------------- bracket generation (proper bye distribution) ---------------- */
function shuffle(arr){
  const a=[...arr];
  for(let i=a.length-1;i>0;i--){ const j=Math.floor(Math.random()*(i+1)); [a[i],a[j]]=[a[j],a[i]]; }
  return a;
}

// token: string (known name) OR {ref:{r,i}} pointing at coordinates inside state.bracket.
// Using coordinates (not live object references) means this keeps working correctly
// even after the state is cloned via JSON (autosave reload, undo history, saved games).
function resolveToken(t){
  if(t===null || t===undefined) return null;
  if(typeof t==='string') return t;
  const obj = state.bracket[t.ref.r][t.ref.i];
  return resolveRef(obj);
}
function resolveRef(obj){
  if(obj.kind==='match') return obj.winner;
  if(obj.kind==='bye') return resolveToken(obj.token);
  return null;
}

function generateBracket(names){
  // خلط مرة واحدة فقط في البداية، وبعدها ترتيب الفائزين يظل ثابتًا.
  // إذا كان العدد فرديًا، آخر لاعب يتأهل للدور التالي مباشرة
  // بدون إنشاء خانة "مستريح"؛ سيظهر اسمه فقط في الدور الذي سيلعب فيه.
  let tokens = shuffle(names);
  const rounds = [];
  let r = 0;

  while(tokens.length > 1){
    const roundItems = [];
    const nextTokens = [];

    if(tokens.length % 2 === 1){
      nextTokens.push(tokens.pop());
    }

    for(let i=0;i<tokens.length;i+=2){
      const m = {kind:'match', p1:tokens[i], p2:tokens[i+1], winner:null, played:false};
      const matchIndex = roundItems.length;
      roundItems.push(m);
      nextTokens.push({ref:{r, i:matchIndex}});
    }

    rounds.push(roundItems);
    tokens = nextTokens;
    r++;
  }
  return rounds;
}

function setWinner(r,i,name){
  if(!isAdmin) return;
  snapshot();
  const item = state.bracket[r][i];
  item.winner = name; item.played = true;
  render();
}

function startBracket(entrants){
  state.entrants = entrants;
  state.bracket = generateBracket(entrants);
  state.savedId = null;
  state.screen='bracket';
  render();
}

/* ---------------- navigation ---------------- */
function pickGame(game){
  snapshot();
  state.game=game;
  if(game==='اخرى'){ state.screen='subtype'; }
  else if(game==='كورة'){ state.category='team'; state.screen='teamMode'; }
  else { state.category='individual'; state.players=['','']; state.screen='individualSetup'; }
  render();
}
function pickCategory(cat){
  snapshot();
  state.category=cat;
  if(cat==='individual'){ state.players=['','']; state.screen='individualSetup'; }
  else { state.teams=['','']; state.screen='teamMode'; }
  render();
}
function pickTeamMode(ready){
  snapshot();
  if(ready){ state.teams=['','']; state.screen='teamNamesSetup'; }
  else { state.drawPlayers=['','','','']; state.numTeams=2; state.screen='teamDrawPlayers'; }
  render();
}

/* ---------------- list editing ---------------- */
function addItem(key){ snapshot(); state[key].push(''); render(); }
function removeItem(key,i){ if(state[key].length>2){ snapshot(); state[key].splice(i,1); render(); } }
function updateItem(key,i,val){ state[key][i]=val; persistCurrent(); }

function changeNumTeams(delta){
  const v = state.numTeams+delta;
  if(v>=2 && v<=8){ snapshot(); state.numTeams=v; render(); }
}

function doQuickDraw(){
  const names = state.drawPlayers.map(p=>p.trim()).filter(Boolean);
  if(names.length < state.numTeams){
    document.getElementById('drawWarn').textContent = 'لازم عدد اللاعبين يكون أكبر من أو يساوي عدد الفرق';
    return;
  }
  snapshot();
  const shuffled = shuffle(names);
  const teams = Array.from({length:state.numTeams},()=>[]);
  shuffled.forEach((p,i)=>teams[i%state.numTeams].push(p));
  state.drawResult = teams.map((players,idx)=>({name:'فريق '+(idx+1), players}));
  state.screen='teamDrawResult';
  render();
}
function updateDrawTeamName(i,val){ state.drawResult[i].name = val; persistCurrent(); }

function confirmDrawAndStart(){
  const entrants = state.drawResult.map((t,i)=> t.name.trim() || ('فريق '+(i+1)));
  snapshot();
  startBracket(entrants);
}
function startFromList(key){
  const names = state[key].map(p=>p.trim()).filter(Boolean);
  if(names.length<2) return;
  snapshot();
  startBracket(names);
}

/* ---------------- save / load multiple tournaments ---------------- */
function saveCurrent(){
  if(!isAdmin) return;
  const existing = savedList.find(s=>s.id===state.savedId);
  const defaultName = existing ? existing.name : (state.game+' - '+new Date().toLocaleDateString('ar-EG'));
  const name = prompt('اسم البطولة؟', defaultName);
  if(name===null) return;
  if(!state.savedId) state.savedId = 'g'+Date.now();
  const cleanState = JSON.parse(JSON.stringify(state));
  cleanState.viewOnly = false;
  const entry = {id:state.savedId, name: name.trim()||defaultName, game:state.game, savedAt:Date.now(), data:cleanState};
  if(db){
    db.ref('savedGames/'+state.savedId).set(entry).then(()=>{
      alert('✅ اتحفظت اللعبة، وهتظهر لأي حد بيفتح اللينك');
    }).catch(()=>{
      const idx = savedList.findIndex(s=>s.id===state.savedId);
      if(idx>=0) savedList[idx]=entry; else savedList.push(entry);
      persistSavedListCache(); render();
      alert('⚠️ اتحفظت على جهازك بس — حصلت مشكلة في الاتصال بالسحابة');
    });
  } else {
    const idx = savedList.findIndex(s=>s.id===state.savedId);
    if(idx>=0) savedList[idx]=entry; else savedList.push(entry);
    persistSavedListCache(); render();
    alert('✅ اتحفظت اللعبة على جهازك (مفيش اتصال حاليًا بقاعدة البيانات المشتركة)');
  }
}
function loadSaved(id){
  if(!isAdmin) return;
  const entry = savedList.find(s=>s.id===id);
  if(!entry) return;
  snapshot();
  state = JSON.parse(JSON.stringify(entry.data));
  state.viewOnly = false;
  state.screen = 'bracket';
  render();
}
function loadSavedView(id){
  const entry = savedList.find(s=>s.id===id);
  if(!entry) return;
  snapshot();
  state = JSON.parse(JSON.stringify(entry.data));
  state.viewOnly = true;
  state.screen = 'bracket';
  render();
}
function deleteSaved(id){
  if(!isAdmin) return;
  if(!confirm('تحذف البطولة دي من المحفوظات؟')) return;
  if(db){
    db.ref('savedGames/'+id).remove();
  } else {
    savedList = savedList.filter(s=>s.id!==id);
    persistSavedListCache();
    render();
  }
}

function deleteCurrentTournament(){
  if(!isAdmin || !state.savedId) return;

  const id = state.savedId;
  const entry = savedList.find(s=>s.id===id);
  const name = entry ? entry.name : 'البطولة الحالية';

  if(!confirm(`⚠️ هل أنت متأكد من حذف "${name}"؟\n\nسيتم حذفها من البطولات الظاهرة لكل من يدخل اللعبة.\nهذا لا يعني إنهاء البطولة؛ الحذف فقط هو الذي يخفيها عن الجميع.`)) return;

  if(db){
    db.ref('savedGames/'+id).remove().then(()=>{
      savedList = savedList.filter(s=>s.id!==id);
      persistSavedListCache();
      state = defaultState();
      state.screen = 'adminHome';
      render();
      alert('✅ تم حذف البطولة للجميع.');
    }).catch(()=>{
      alert('❌ حصلت مشكلة في حذف البطولة من السحابة. حاول مرة أخرى.');
    });
  }else{
    savedList = savedList.filter(s=>s.id!==id);
    persistSavedListCache();
    state = defaultState();
    state.screen = 'adminHome';
    render();
    alert('⚠️ تم حذفها من هذا الجهاز فقط لأن الاتصال بقاعدة البيانات غير متاح.');
  }
}

/* ---------------- render ---------------- */
function render(){
  if(!isAdmin){
    if(ADMIN_SCREENS.includes(state.screen)) state.screen='landing';
    if(state.screen==='bracket' && !state.viewOnly) state.screen='landing';
  }
  persistCurrent();
  document.getElementById('homeBtn').style.display = state.screen==='landing' ? 'none':'inline-block';
  document.getElementById('backBtn').style.display = historyStack.length>0 ? 'inline-block':'none';
  document.getElementById('logoutBtn').style.display = isAdmin ? 'inline-block':'none';
  const app=document.getElementById('app');
  app.innerHTML='';
  if(state.screen==='landing') return renderLanding(app);
  if(state.screen==='secretPassword') return renderSecretPassword(app);
  if(state.screen==='adminHome') return renderAdminHome(app);
  if(state.screen==='subtype') return renderSubtype(app);
  if(state.screen==='individualSetup') return renderList(app,{
    key:'players', title:'مين هيلعب؟', sub:'دخّل أسماء اللاعبين', placeholder:'اسم اللاعب',
    onStart:()=>startFromList('players')
  });
  if(state.screen==='teamMode') return renderTeamMode(app);
  if(state.screen==='teamNamesSetup') return renderList(app,{
    key:'teams', title:'أسماء الفرق', sub:'دخّل أسماء الفرق المشاركة', placeholder:'اسم الفريق',
    onStart:()=>startFromList('teams')
  });
  if(state.screen==='teamDrawPlayers') return renderTeamDrawPlayers(app);
  if(state.screen==='teamDrawResult') return renderTeamDrawResult(app);
  if(state.screen==='bracket') return renderBracket(app);
}

let isPwRevealed = false;
function toggleCurrentPwReveal(){
  isPwRevealed = !isPwRevealed;
  const textEl = document.getElementById('currentPwText');
  const btnEl = document.getElementById('toggleRevealBtn');
  if(textEl && btnEl){
    textEl.textContent = isPwRevealed ? adminPassword : '••••••••';
    btnEl.textContent = isPwRevealed ? '🙈 إخفاء' : '👁️ إظهار';
  }
}

function saveNewAdminPassword(){
  const newPw = (document.getElementById('newAdminPw')?.value || '').trim();
  const confirmPw = (document.getElementById('confirmAdminPw')?.value || '').trim();
  const warn = document.getElementById('pwWarn');

  if(!newPw){
    if(warn) warn.textContent = '❌ برجاء إدخال كلمة المرور الجديدة';
    return;
  }
  if(newPw.length < 4){
    if(warn) warn.textContent = '❌ كلمة المرور يجب أن تكون 4 خانات على الأقل';
    return;
  }
  if(newPw !== confirmPw){
    if(warn) warn.textContent = '❌ كلمتا المرور غير متطابقتين';
    return;
  }

  adminPassword = newPw;
  safeSet('olympiad_admin_password', newPw);

  if(db){
    db.ref('settings/adminPassword').set(newPw).then(()=>{
      alert('✅ تم تغيير كلمة مرور المنظم بنجاح ومزامنتها على السحابة!');
      isAdmin = true;
      safeSessionSet('olympiad_admin', true);
      state.screen = 'adminHome';
      render();
    }).catch(()=>{
      alert('⚠️ تم حفظ كلمة المرور محلياً فقط (تعذر الاتصال بالسحابة)');
      isAdmin = true;
      safeSessionSet('olympiad_admin', true);
      state.screen = 'adminHome';
      render();
    });
  } else {
    alert('✅ تم حفظ وتعيين كلمة المرور الجديدة بنجاح!');
    isAdmin = true;
    safeSessionSet('olympiad_admin', true);
    state.screen = 'adminHome';
    render();
  }
}

/* ---------------- next-round preview info ---------------- */
let lastBracketRounds = null;

function nextRoundInfo(rounds, r, i){
  if(r+1 >= rounds.length) return null;
  const nextRound = rounds[r+1];
  for(let j=0;j<nextRound.length;j++){
    const item = nextRound[j];
    let matched = false, otherRef = null;
    if(item.kind==='match'){
      if(item.p1 && typeof item.p1==='object' && item.p1.ref && item.p1.ref.r===r && item.p1.ref.i===i){ matched=true; otherRef=item.p2; }
      else if(item.p2 && typeof item.p2==='object' && item.p2.ref && item.p2.ref.r===r && item.p2.ref.i===i){ matched=true; otherRef=item.p1; }
    } else if(item.kind==='bye'){
      if(item.token && typeof item.token==='object' && item.token.ref && item.token.ref.r===r && item.token.ref.i===i){ matched=true; }
    }
    if(matched){
      return { roundIndex:r+1, isBye:item.kind==='bye', opponentVal: otherRef ? resolveToken(otherRef) : null };
    }
  }
  return null;
}

function roundLabel(r,total){
  const fromEnd = total-1-r;
  if(fromEnd===0) return 'النهائي 🏆';
  if(fromEnd===1) return 'نصف النهائي';
  if(fromEnd===2) return 'ربع النهائي';
  return 'الدور '+(r+1);
}

function nextInfoHtml(rounds,total,r,i){
  const info = nextRoundInfo(rounds,r,i);
  if(!info) return '';
  const label = roundLabel(info.roundIndex,total).replace(' 🏆','');
  if(info.opponentVal){
    return `<div class="next-info">→ الفايز هيلعب مع <b>${info.opponentVal}</b> في ${label}</div>`;
  }
  return `<div class="next-info">→ الفايز هيتأهل لـ ${label}</div>`;
}

function renderBracket(app){
  const rounds = state.bracket;
  const total = rounds.length;
  const readOnly = !!state.viewOnly;
  const lastRoundFinalMatch = rounds[total-1].find(it=>it.kind==='match');
  const champion = lastRoundFinalMatch && lastRoundFinalMatch.played ? lastRoundFinalMatch.winner : null;

  let champHtml = '';
  if(champion){
    champHtml = `
      <div class="champion">
        <div class="cap">🏆 بطل ${state.game}</div>
        <div class="cname">${champion}</div>
      </div>`;
  }

  let cols = '';
  rounds.forEach((round,r)=>{
    let itemsHtml = '';
    round.forEach((item,i)=>{
      const cardId = `item-${r}-${i}`;
      const v1 = resolveToken(item.p1);
      const v2 = resolveToken(item.p2);
      const bothFilled = !!v1 && !!v2;
      let slotsHtml = '';
      [v1,v2].forEach(v=>{
        if(!v){
          slotsHtml += `<div class="slot empty">— في الانتظار —</div>`;
        } else if(item.played){
          const cls = item.winner===v ? 'winner':'loser';
          slotsHtml += `<div class="slot ${cls}">${v}</div>`;
        } else if(bothFilled && !readOnly){
          slotsHtml += `<div class="slot clickable" onclick="setWinner(${r},${i},'${v.replace(/'/g,"\\'")}')">${v}</div>`;
        } else {
          slotsHtml += `<div class="slot">${v}</div>`;
        }
      });
      itemsHtml += `
        <div class="match ${bothFilled && !item.played && !readOnly ? 'playable':''}" id="${cardId}">
          ${slotsHtml}
          ${bothFilled && !item.played && !readOnly ? '<div class="play-hint">دوس على اسم الفايز</div>' : ''}
          ${nextInfoHtml(rounds,total,r,i)}
        </div>`;
    });
    cols += `
      <div class="round-col">
        <div class="round-title">${roundLabel(r,total)}</div>
        ${itemsHtml}
      </div>`;
  });

  const headActions = readOnly
    ? ''
    : `<div style="display:flex;gap:8px;flex-wrap:wrap;justify-content:flex-end">
         <button class="save-btn" onclick="saveCurrent()">💾 حفظ اللعبة</button>
         ${state.savedId ? `<button class="top-btn" style="border-color:var(--bronze);color:var(--bronze)" onclick="deleteCurrentTournament()">🗑️ حذف البطولة للجميع</button>` : ''}
       </div>`;
  const bottomBtn = readOnly
    ? `<button class="ghost-btn" style="max-width:260px" onclick="goHome()">⬅ كل البطولات</button>`
    : `<button class="ghost-btn" style="max-width:260px" onclick="goHome()">↺ بطولة جديدة</button>`;
  const note = readOnly
    ? `<div class="view-note">👀 وضع المتابعة فقط — النتايج بتتحدث من غير ما تقدر تعدلها</div>`
    : '';

  app.innerHTML = `
    <div class="bracket-head">
      <div class="title">🏟️ ${state.game}</div>
      ${headActions}
    </div>
    ${note}
    ${champHtml}
    <div class="bracket-scroll"><div class="bracket" id="bracketInner">${cols}</div></div>
    <div class="reset-wrap">${bottomBtn}</div>
  `;

  lastBracketRounds = rounds;
}

attachSavedListener();
attachAdminPasswordListener();
render();
